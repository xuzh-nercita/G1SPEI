[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "g1spei"
version = "1.0.0rc1"
description = "Tiled monthly G1SPEI production with reusable climate and Gamma parameters"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Zhenheng Xu", email = "xuzh@nercita.org.cn"}]
dependencies = ["numpy>=1.24", "scipy>=1.10", "GDAL>=3.6"]

[project.optional-dependencies]
test = ["pytest>=7", "ruff>=0.8"]

[project.scripts]
g1spei = "g1spei.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
